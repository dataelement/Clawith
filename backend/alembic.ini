# Alembic configuration

[alembic]
script_location = alembic
prepend_sys_path = .
# Operator migration remains unavailable until the reviewed G008 target baseline.
sqlalchemy.url = postgresql+asyncpg://clawith:clawith@localhost:5432/clawith_target

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
