services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: clawith_target
      POSTGRES_USER: clawith_test
      POSTGRES_PASSWORD: isolated-test-only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawith_test -d clawith_target"]
      interval: 1s
      timeout: 3s
      retries: 45
