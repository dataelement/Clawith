# ============================================================
# CD 专用 Docker Compose
# 仅更新应用容器；PostgreSQL、Redis、MinIO 由服务器现有环境管理。
# 服务器必须预先创建 CLAWITH_DOCKER_NETWORK 指定的网络，并提供 .env、
# ss-nodes.json 和 nginx/default.conf。
# ============================================================

services:
  backend-api:
    image: clawith-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://clawith:clawith@postgres:5432/clawith
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PROCESS_ROLE: api
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      AGENT_RUNTIME_COMMAND_CONCURRENCY: ${AGENT_RUNTIME_COMMAND_CONCURRENCY:-10}
      AGENT_RUNTIME_V2_ENABLED: "true"
      AGENT_RUNTIME_V2_AGENT_IDS: ""
      AGENT_RUNTIME_V2_SOURCE_TYPES: ""
      DOCKER_NETWORK: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
      CORS_ORIGINS: '["*"]'
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/agents
      STORAGE_LOCAL_FALLBACK_ENABLED: ${STORAGE_LOCAL_FALLBACK_ENABLED:-true}
      S3_BUCKET: ${S3_BUCKET:-clawith}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-clawith}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-clawith-minio-secret}}
      S3_PREFIX: ${S3_PREFIX:-agents}
    volumes:
      - /data/agent_data:/data/agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ss-nodes.json:/data/ss-nodes.json:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    networks:
      default:
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend-worker:
    image: clawith-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://clawith:clawith@postgres:5432/clawith
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PROCESS_ROLE: bootstrap,worker,connector
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      AGENT_RUNTIME_COMMAND_CONCURRENCY: ${AGENT_RUNTIME_COMMAND_CONCURRENCY:-10}
      AGENT_RUNTIME_V2_ENABLED: "true"
      AGENT_RUNTIME_V2_AGENT_IDS: ""
      AGENT_RUNTIME_V2_SOURCE_TYPES: ""
      DOCKER_NETWORK: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
      CORS_ORIGINS: '["*"]'
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/agents
      STORAGE_LOCAL_FALLBACK_ENABLED: ${STORAGE_LOCAL_FALLBACK_ENABLED:-true}
      S3_BUCKET: ${S3_BUCKET:-clawith}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-clawith}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-clawith-minio-secret}}
      S3_PREFIX: ${S3_PREFIX:-agents}
    volumes:
      - /data/agent_data:/data/agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ss-nodes.json:/data/ss-nodes.json:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: clawith-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3008}:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - default
    depends_on:
      - backend-api

networks:
  default:
    external: true
    name: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
